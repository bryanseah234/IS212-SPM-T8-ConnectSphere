# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Prepared configuration; repository owner must install/enable the GitHub App.
language: en-GB
reviews:
  profile: chill
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_instructions:
    - path: '**/*'
      instructions: >-
        Read CONTRIBUTING.md and docs/repository-setup.md. Prioritise correctness,
        security, missing regression tests, and broken contracts. Keep feedback
        actionable and explain the impact. This is a school monorepo whose
        application stack is undecided. Do not request framework-specific
        tooling until a stack decision is recorded. Review is advisory;
        human approval and deterministic CI checks govern merging.
