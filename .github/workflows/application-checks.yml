name: Application Checks

on:
  pull_request:
    paths:
      - "api/**"
      - "backend/**"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/application-checks.yml"

permissions:
  contents: read

jobs:
  application-checks:
    name: application-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
