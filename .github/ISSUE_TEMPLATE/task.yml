name: Feature or engineering task
description: Agree on a small, reviewable piece of work.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: Explain who benefits and what they should be able to do.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that make this task complete.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, dependencies, and testing
      description: Note relevant boundaries and how the result will be verified.
