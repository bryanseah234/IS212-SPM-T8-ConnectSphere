minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # Public Git commit for v6.0.0, not a credential.
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # pragma: allowlist secret
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    # Public Git commit for v1.5.0, not a credential.
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458 # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args: [--no-verify]

  - repo: local
    hooks:
      - id: commit-message
        name: Conventional commit message
        entry: python scripts/check_metadata.py commit-msg
        language: python
        stages: [commit-msg]
      - id: branch-name
        name: Branch naming convention
        entry: python scripts/check_metadata.py branch
        language: python
        stages: [pre-push]
        pass_filenames: false
        always_run: true
